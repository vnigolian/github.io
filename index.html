<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Valentin Z. Nigolian — Geometry Processing Researcher</title>
<meta name="description" content="Valentin Nigolian — research on volumetric mapping for tetrahedral meshes, and C++ engineering for geometry processing." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<!-- Backdrop image: preloaded so the browser starts fetching it right
     away instead of waiting to parse styles.css first, which is what
     caused the visible pop-in. This preloads the DARK image since dark
     is the default theme — someone who has chosen light before will
     load images/bg-light.jpg a moment later instead (no preload for
     that one, since we can't know their saved choice this early without
     giving up the preload's head start). Update this path if you rename
     images/bg-dark.jpg. -->
<link rel="preload" as="image" href="images/bg-dark.jpg" fetchpriority="high" />
<script>
  // Applied before first paint so there's no flash of the wrong theme.
  // Dark is the default whenever the person hasn't chosen one before.
  (function () {
    var saved = localStorage.getItem("theme");
    document.documentElement.dataset.theme = saved === "light" ? "light" : "dark";
  })();
</script>
</head>
<body>

<!-- Interactive backdrop: hidden (display:none) in "image" mode, where the
     plain CSS background-image above shows through instead. See
     background-live.js for the Voronoi/Delaunay logic. -->
<canvas id="bg-canvas" aria-hidden="true"></canvas>

<button id="bg-mode-toggle" class="theme-toggle bg-mode-toggle" type="button" aria-label="Switch backdrop mode">🖼️</button>
<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch between light and dark theme">🌙</button>

<!-- Only shown in "voronoi" mode (see applyMode() in background-live.js),
     sitting right below the two corner buttons. A single on/off setting
     reads more usably as a checkbox than a lone radio button, which can't
     be toggled back off by clicking it again. -->
<div id="voronoi-controls" class="bg-controls-panel" hidden>
  <label class="bg-controls-row">
    <input type="checkbox" id="voronoi-smooth-checkbox" />
    smooth
  </label>
  <label class="bg-controls-row">
    drag
    <input type="number" id="voronoi-drag-distance" min="1" max="200" step="1" />
    px
  </label>
</div>

<!-- Only shown in "circles" mode. "repulse" is a different kind of
     smoothing than Voronoi's "smooth": overlapping clusters gently push
     each other apart instead of relaxing points toward Voronoi-cell
     centroids. -->
<div id="circles-controls" class="bg-controls-panel" hidden>
  <label class="bg-controls-row">
    <input type="checkbox" id="circle-repulse-checkbox" />
    repulse
  </label>
</div>

<!-- Nudge sitting just below the two corner buttons above; blinks slowly
     until either button is used, then disappears (and stays hidden, via
     localStorage). See dismissHint() in background-live.js. -->
<div id="bg-hint" class="bg-hint" aria-hidden="true">
  <div class="bg-hint-box">try these out!</div>
</div>

<main>
  <div class="content">

    <div class="topbar mono" id="topbar"></div>

    <div class="hero">
      <div>
        <h1 data-site-name></h1>
        <div class="hero-role mono" data-site-role></div>
        <p class="tagline" data-site-tagline></p>
      </div>
      <div class="hero-visuals">
        <div class="profile-pic-wrap">
          <img id="profile-pic" src="images/black_square.png" alt="" />
        </div>
      </div>
    </div>

    <section id="about" aria-labelledby="about-h">
      <div class="section-heading">
        <h2 id="about-h">About me</h2>
      </div>
      <ul class="about-list" id="about-list"></ul>
    </section>

    <section id="papers" aria-labelledby="papers-h">
      <div class="section-heading">
        <h2 id="papers-h">Papers</h2>
        <span class="section-count mono" id="papers-count">00</span>
      </div>
      <div class="entry-list" id="papers-list"></div>
    </section>

    <section id="code-projects" aria-labelledby="code-projects-h">
      <div class="section-heading">
        <h2 id="code-projects-h">Code Projects</h2>
        <span class="section-count mono" id="code-projects-count">00</span>
      </div>
      <div class="entry-list" id="code-projects-list"></div>
    </section>

    <section id="other-projects" aria-labelledby="other-projects-h">
      <div class="section-heading">
        <h2 id="other-projects-h">Other Projects</h2>
        <span class="section-count mono" id="other-projects-count">00</span>
      </div>
      <div class="entry-list" id="other-projects-list"></div>
    </section>

    <section id="awards" aria-labelledby="awards-h">
      <div class="section-heading">
        <h2 id="awards-h">Awards & Funding</h2>
        <span class="section-count mono" id="awards-count">00</span>
      </div>
      <div class="entry-list" id="awards-list"></div>
    </section>

    <section id="experience" aria-labelledby="experience-h">
      <div class="section-heading">
        <h2 id="experience-h">Experience</h2>
      </div>
      <div class="timeline" id="experience-timeline"></div>
    </section>

    <footer>
      <span data-site-name></span> · Biel/Bienne, Switzerland
    </footer>

  </div>
</main>

<script src="vendor/d3-delaunay.min.js"></script>
<script src="background-live.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
